<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-rag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="50%" stop-color="#111c3d"/>
      <stop offset="100%" stop-color="#050a18"/>
    </linearGradient>
    <linearGradient id="blue-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg-rag)"/>

  <!-- Status Capsule -->
  <rect x="40" y="30" width="310" height="34" rx="17" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="1.2"/>
  <circle cx="58" cy="47" r="5" fill="#3b82f6"/>
  <text x="74" y="52" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#60a5fa">APPLIED ML · NLP &amp; RAG ENGINE</text>

  <!-- Left: RAG Search & Reranking Architecture -->
  <rect x="40" y="85" width="410" height="380" rx="14" fill="rgba(10,18,38,0.85)" stroke="rgba(59,130,246,0.3)" stroke-width="1.5"/>
  <text x="65" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Dense Vector Retrieval &amp; Cross-Encoder</text>
  <text x="65" y="140" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Semantic Indexing with Source Attribution</text>

  <!-- Query Box -->
  <rect x="65" y="160" width="360" height="42" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(59,130,246,0.3)"/>
  <text x="80" y="186" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#e2e8f0">Q: "Carbon overhead of LLM guardrails?"</text>

  <!-- Connectors -->
  <line x1="245" y1="202" x2="245" y2="225" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Vector Space Match (Stage 1) -->
  <rect x="65" y="225" width="170" height="75" rx="8" fill="rgba(6,182,212,0.1)" stroke="rgba(6,182,212,0.4)"/>
  <text x="78" y="248" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#22d3ee">Dense Retrieval</text>
  <text x="78" y="268" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">Top-K = 6 passages</text>
  <text x="78" y="285" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38bdf8">Cosine Sim: 0.88</text>

  <!-- Cross-Encoder Reranker (Stage 2) -->
  <rect x="255" y="225" width="170" height="75" rx="8" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.4)"/>
  <text x="268" y="248" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#34d399">Cross-Encoder</text>
  <text x="268" y="268" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">Joint Self-Attention</text>
  <text x="268" y="285" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#10b981">Confidence: 94.6%</text>

  <!-- Connectors -->
  <line x1="245" y1="300" x2="245" y2="325" stroke="#10b981" stroke-width="2"/>

  <!-- Grounded Output Box -->
  <rect x="65" y="325" width="360" height="115" rx="10" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.3)"/>
  <text x="80" y="350" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#34d399">Grounded Answer (Zero Hallucination):</text>
  <text x="80" y="375" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">"Runtime guardrails add +142.8 ms latency</text>
  <text x="80" y="395" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">and emit up to 18.6 gCO2eq per 1k queries."</text>
  <text x="80" y="423" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38bdf8">[Source: Green_AI_Safety_Policy.pdf, §3.2]</text>

  <!-- Right: Verification Metrics -->
  <rect x="470" y="85" width="290" height="200" rx="14" fill="rgba(10,18,38,0.85)" stroke="rgba(59,130,246,0.3)" stroke-width="1.5"/>
  <text x="495" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff">RAG Performance Benchmark</text>

  <rect x="495" y="140" width="240" height="40" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="510" y="165" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">Context Relevance: <tspan fill="#34d399" font-weight="700">96.2%</tspan></text>

  <rect x="495" y="190" width="240" height="40" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="510" y="215" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">Grounding Faithfulness: <tspan fill="#22d3ee" font-weight="700">99.1%</tspan></text>

  <rect x="495" y="240" width="240" height="40" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="510" y="265" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">Answer Attribution: <tspan fill="#38bdf8" font-weight="700">100.0%</tspan></text>

  <!-- Bottom Metric Pods -->
  <rect x="470" y="305" width="135" height="75" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(16,185,129,0.2)"/>
  <text x="485" y="330" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Search Latency</text>
  <text x="485" y="365" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800" fill="#10b981">&lt; 38 ms</text>

  <rect x="625" y="305" width="135" height="75" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(6,182,212,0.2)"/>
  <text x="640" y="330" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Hallucination</text>
  <text x="640" y="365" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800" fill="#06b6d4">0.0%</text>

  <rect x="470" y="390" width="290" height="75" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(59,130,246,0.2)"/>
  <text x="490" y="420" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Architecture</text>
  <text x="490" y="450" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#60a5fa">Hybrid Vector + Reranker</text>
</svg>
