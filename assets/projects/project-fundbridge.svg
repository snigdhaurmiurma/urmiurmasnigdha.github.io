<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-fund" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f1d40"/>
      <stop offset="100%" stop-color="#050a1a"/>
    </linearGradient>
    <linearGradient id="fund-cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg-fund)"/>

  <!-- Status Capsule -->
  <rect x="40" y="30" width="340" height="34" rx="17" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="1.2"/>
  <circle cx="58" cy="47" r="5" fill="#10b981"/>
  <text x="74" y="52" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">FINTECH · AES-256 &amp; SHA-256 AUDIT CHAIN</text>

  <!-- Left: Security Architecture & Escrow Flow -->
  <rect x="40" y="85" width="410" height="380" rx="14" fill="rgba(11,19,41,0.9)" stroke="rgba(56,189,248,0.3)" stroke-width="1.5"/>
  <text x="65" y="120" font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Secure Micro-Loan Management Architecture</text>
  <text x="65" y="140" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Double-Entry Ledger with Cryptographic Defense</text>

  <!-- Flow Diagrams -->
  <g transform="translate(65, 160)">
    <!-- Stage 1: Borrower Request -->
    <rect x="0" y="0" width="100" height="60" rx="8" fill="rgba(99,102,241,0.15)" stroke="#6366f1" stroke-width="1.2"/>
    <text x="50" y="25" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" text-anchor="middle">Borrower</text>
    <text x="50" y="45" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1" text-anchor="middle">Loan Request</text>

    <!-- Arrow -->
    <line x1="100" y1="30" x2="135" y2="30" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="135,30 128,26 128,34" fill="#38bdf8"/>

    <!-- Stage 2: AES-256 Vault -->
    <rect x="135" y="0" width="100" height="60" rx="8" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1.2"/>
    <text x="185" y="25" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">AES-256-GCM</text>
    <text x="185" y="45" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1" text-anchor="middle">KYC Encrypted</text>

    <!-- Arrow -->
    <line x1="235" y1="30" x2="270" y2="30" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="270,30 263,26 263,34" fill="#38bdf8"/>

    <!-- Stage 3: Lender Escrow -->
    <rect x="270" y="0" width="90" height="60" rx="8" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="315" y="25" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#7dd3fc" text-anchor="middle">Escrow</text>
    <text x="315" y="45" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1" text-anchor="middle">Funded 100%</text>

    <!-- Double-Entry Accounting Ledger Card -->
    <rect x="0" y="85" width="360" height="180" rx="10" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.1)"/>
    <text x="15" y="112" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Tamper-Evident SHA-256 Ledger</text>
    
    <!-- Ledger Block 1 -->
    <rect x="15" y="125" width="330" height="36" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(16,185,129,0.3)"/>
    <text x="25" y="147" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a7f3d0">Block #104 · Disbursement: +$1,200.00 (DR: Escrow | CR: Wallet)</text>

    <!-- Ledger Block 2 -->
    <rect x="15" y="170" width="330" height="36" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(56,189,248,0.3)"/>
    <text x="25" y="192" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7dd3fc">Block #105 · Repayment: -$112.50 (DR: Wallet | CR: Escrow)</text>

    <!-- SHA-256 Hash Verification -->
    <rect x="15" y="215" width="330" height="36" rx="6" fill="rgba(99,102,241,0.1)" stroke="rgba(99,102,241,0.3)"/>
    <text x="25" y="237" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#c7d2fe">Chain Hash: e3b0c44298fc1c149afbf4c8996fb92427ae... [VERIFIED]</text>
  </g>

  <!-- Right: SOC Defense & FinTech Controls -->
  <rect x="470" y="85" width="290" height="200" rx="14" fill="rgba(11,19,41,0.9)" stroke="rgba(56,189,248,0.3)" stroke-width="1.5"/>
  <text x="495" y="120" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Security Gateway Controls</text>

  <rect x="495" y="140" width="240" height="38" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(56,189,248,0.2)"/>
  <text x="510" y="164" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">Rate Limiter: <tspan fill="#38bdf8" font-weight="700">30 req / 5 min</tspan></text>

  <rect x="495" y="188" width="240" height="38" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(16,185,129,0.2)"/>
  <text x="510" y="212" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">Bcrypt Hash: <tspan fill="#10b981" font-weight="700">Cost Factor 10</tspan></text>

  <rect x="495" y="236" width="240" height="38" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(99,102,241,0.2)"/>
  <text x="510" y="260" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">Anti-Predatory APR: <tspan fill="#a5b4fc" font-weight="700">Capped @ 12%</tspan></text>

  <!-- Bottom Metric Pods -->
  <rect x="470" y="305" width="135" height="75" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(16,185,129,0.2)"/>
  <text x="485" y="330" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#94a3b8">Integrity Proof</text>
  <text x="485" y="365" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#10b981">100% Immutable</text>

  <rect x="625" y="305" width="135" height="75" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(56,189,248,0.2)"/>
  <text x="640" y="330" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#94a3b8">Lockout Defense</text>
  <text x="640" y="365" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#38bdf8">&lt; 5 Failures</text>

  <rect x="470" y="390" width="290" height="75" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(99,102,241,0.2)"/>
  <text x="490" y="420" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#94a3b8">Full-Stack Tech Stack</text>
  <text x="490" y="450" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#818cf8">React · Express · SQLite · JWT</text>
</svg>
