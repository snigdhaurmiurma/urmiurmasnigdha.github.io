<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-nli" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b112c"/>
      <stop offset="50%" stop-color="#081b3a"/>
      <stop offset="100%" stop-color="#040b18"/>
    </linearGradient>
    <linearGradient id="grad-blue-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg-nli)"/>

  <!-- Top Title Tag -->
  <rect x="40" y="30" width="280" height="34" rx="17" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="180" y="52" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">CLSC NEURAL FRAMEWORK</text>

  <!-- Node 1: Multilingual Encoder -->
  <rect x="40" y="110" width="190" height="280" rx="14" fill="rgba(14,27,62,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="1.5"/>
  <text x="135" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Frozen Multilingual</text>
  <text x="135" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#60a5fa" text-anchor="middle">Encoder (LaBSE/XLM-R)</text>

  <rect x="60" y="195" width="150" height="32" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
  <text x="135" y="216" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">15 Languages (XNLI)</text>

  <rect x="60" y="240" width="150" height="32" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
  <text x="135" y="261" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">Token Embeddings</text>

  <rect x="60" y="285" width="150" height="32" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
  <text x="135" y="306" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">Layer-wise States</text>

  <!-- Connectors -->
  <line x1="230" y1="250" x2="290" y2="250" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="4 4"/>
  <polygon points="290,250 280,244 280,256" fill="#3b82f6"/>

  <!-- Node 2: Soft Prompt Projector -->
  <rect x="290" y="140" width="220" height="220" rx="14" fill="rgba(8,35,70,0.85)" stroke="rgba(6,182,212,0.5)" stroke-width="1.5"/>
  <text x="400" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Confidence-Gated</text>
  <text x="400" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#22d3ee" text-anchor="middle">Prompt Projector (CGAP)</text>

  <circle cx="400" cy="255" r="35" fill="none" stroke="url(#grad-blue-cyan)" stroke-width="3"/>
  <text x="400" y="260" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">W_proj</text>
  <text x="400" y="325" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">Cosine Soft Distance</text>

  <!-- Connectors -->
  <line x1="510" y1="250" x2="570" y2="250" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="4 4"/>
  <polygon points="570,250 560,244 560,256" fill="#06b6d4"/>

  <!-- Node 3: LLM Decoder -->
  <rect x="570" y="110" width="190" height="280" rx="14" fill="rgba(14,27,62,0.85)" stroke="rgba(16,185,129,0.4)" stroke-width="1.5"/>
  <text x="665" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Autoregressive</text>
  <text x="665" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#34d399" text-anchor="middle">Decoder (Llama-3.2)</text>

  <rect x="590" y="200" width="150" height="40" rx="8" fill="rgba(16,185,129,0.12)" stroke="#10b981"/>
  <text x="665" y="225" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#10b981" text-anchor="middle">Entailment</text>

  <rect x="590" y="250" width="150" height="40" rx="8" fill="rgba(245,158,11,0.12)" stroke="#f59e0b"/>
  <text x="665" y="275" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">Neutral</text>

  <rect x="590" y="300" width="150" height="40" rx="8" fill="rgba(239,68,68,0.12)" stroke="#ef4444"/>
  <text x="665" y="325" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ef4444" text-anchor="middle">Contradiction</text>

  <!-- Bottom Result Banner -->
  <rect x="40" y="420" width="720" height="48" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
  <text x="400" y="450" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">Validated on 15 Diverse Language Subsets (Indic, Germanic, Romance &amp; Slavic)</text>
</svg>