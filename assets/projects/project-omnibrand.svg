<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg-brand)"/>

  <!-- Top Winner Badge -->
  <rect x="40" y="30" width="310" height="34" rx="17" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="195" y="52" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">FREELANCER.COM 1ST PLACE WINNER</text>

  <!-- Left: Geometric Logo Mark & Golden Ratio System -->
  <rect x="40" y="90" width="360" height="370" rx="14" fill="rgba(24,24,27,0.7)" stroke="rgba(245,158,11,0.3)" stroke-width="1.5"/>
  <text x="65" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#ffffff">Logomark Geometry</text>
  <text x="65" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Golden Ratio Construction (1 : 1.618)</text>

  <!-- Geometric Golden Spiral / Logo Mark -->
  <circle cx="220" cy="270" r="100" fill="none" stroke="rgba(245,158,11,0.15)" stroke-width="1"/>
  <circle cx="220" cy="270" r="62" fill="none" stroke="rgba(245,158,11,0.25)" stroke-width="1.2"/>
  <circle cx="220" cy="270" r="38" fill="none" stroke="rgba(245,158,11,0.4)" stroke-width="1.5"/>
  
  <polygon points="220,180 290,320 150,320" fill="none" stroke="url(#gold-grad)" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="220" cy="270" r="16" fill="url(#gold-grad)"/>

  <!-- Right: Corporate Identity & Stationery Palette -->
  <rect x="420" y="90" width="340" height="175" rx="14" fill="rgba(24,24,27,0.7)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <text x="445" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Color Swatch Architecture</text>
  
  <rect x="445" y="150" width="60" height="70" rx="8" fill="#f59e0b"/>
  <text x="475" y="235" font-family="'JetBrains Mono', monospace" font-size="10" fill="#e4e4e7" text-anchor="middle">#F59E0B</text>

  <rect x="520" y="150" width="60" height="70" rx="8" fill="#18181b" stroke="rgba(255,255,255,0.2)"/>
  <text x="550" y="235" font-family="'JetBrains Mono', monospace" font-size="10" fill="#e4e4e7" text-anchor="middle">#18181B</text>

  <rect x="595" y="150" width="60" height="70" rx="8" fill="#09090b" stroke="rgba(255,255,255,0.2)"/>
  <text x="625" y="235" font-family="'JetBrains Mono', monospace" font-size="10" fill="#e4e4e7" text-anchor="middle">#09090B</text>

  <rect x="670" y="150" width="60" height="70" rx="8" fill="#fafafa"/>
  <text x="700" y="235" font-family="'JetBrains Mono', monospace" font-size="10" fill="#e4e4e7" text-anchor="middle">#FAFAFA</text>

  <!-- Right Bottom: Stationery Mockup Cards -->
  <rect x="420" y="285" width="340" height="175" rx="14" fill="rgba(24,24,27,0.7)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <text x="445" y="320" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Stationery &amp; Print Assets</text>

  <!-- Business Card Front -->
  <rect x="445" y="340" width="135" height="85" rx="6" fill="#09090b" stroke="rgba(245,158,11,0.5)" stroke-width="1.2"/>
  <circle cx="475" cy="370" r="8" fill="url(#gold-grad)"/>
  <text x="490" y="374" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#ffffff">OMNI</text>
  <rect x="475" y="390" width="80" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="475" y="400" width="50" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>

  <!-- Business Card Back -->
  <rect x="600" y="340" width="135" height="85" rx="6" fill="url(#gold-grad)"/>
  <polygon points="667,365 685,400 650,400" fill="#09090b"/>
</svg>