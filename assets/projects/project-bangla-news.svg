<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-news" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg-news)"/>

  <!-- Top Title Tag -->
  <rect x="40" y="30" width="310" height="34" rx="17" fill="rgba(239,68,68,0.15)" stroke="#ef4444" stroke-width="1.2"/>
  <text x="195" y="52" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#f87171" text-anchor="middle">MISINFORMATION DETECTOR</text>

  <!-- Left: Dual Input Feeds -->
  <!-- Stream 1: News Image -->
  <rect x="40" y="95" width="220" height="160" rx="12" fill="rgba(31,41,55,0.8)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <text x="60" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">1. Image Input Stream</text>
  <rect x="60" y="145" width="180" height="90" rx="8" fill="rgba(0,0,0,0.4)" stroke="rgba(6,182,212,0.3)"/>
  <circle cx="150" cy="180" r="22" fill="none" stroke="#06b6d4" stroke-width="2"/>
  <text x="150" y="220" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">ResNet / ViT Embeddings</text>

  <!-- Stream 2: News Headline (Bangla) -->
  <rect x="40" y="280" width="220" height="160" rx="12" fill="rgba(31,41,55,0.8)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <text x="60" y="310" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">2. Headline Text Stream</text>
  <rect x="60" y="330" width="180" height="90" rx="8" fill="rgba(0,0,0,0.4)" stroke="rgba(59,130,246,0.3)"/>
  <text x="150" y="365" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#60a5fa" text-anchor="middle">বাংলা সংবাদ শিরোনাম</text>
  <text x="150" y="395" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">BanglaBERT Encodings</text>

  <!-- Center: Multimodal Alignment Engine -->
  <rect x="300" y="150" width="200" height="200" rx="14" fill="rgba(17,24,39,0.9)" stroke="rgba(239,68,68,0.5)" stroke-width="2"/>
  <text x="400" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">Cross-Modal</text>
  <text x="400" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#f87171" text-anchor="middle">Cosine Comparator</text>

  <circle cx="400" cy="275" r="40" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="400" y="280" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#fca5a5" text-anchor="middle">S_sim &lt; θ</text>

  <!-- Connectors -->
  <line x1="260" y1="175" x2="300" y2="210" stroke="#06b6d4" stroke-width="2"/>
  <line x1="260" y1="360" x2="300" y2="290" stroke="#3b82f6" stroke-width="2"/>

  <line x1="500" y1="250" x2="550" y2="250" stroke="#ef4444" stroke-width="2.5"/>
  <polygon points="550,250 540,244 540,256" fill="#ef4444"/>

  <!-- Right: Mismatch Alert Dashboard -->
  <rect x="550" y="110" width="210" height="280" rx="14" fill="rgba(31,41,55,0.8)" stroke="rgba(239,68,68,0.4)" stroke-width="1.5"/>
  <text x="655" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Detection Result</text>

  <rect x="570" y="170" width="170" height="80" rx="10" fill="rgba(239,68,68,0.15)" stroke="#ef4444"/>
  <text x="655" y="205" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#ef4444" text-anchor="middle">⚠️ MISMATCH</text>
  <text x="655" y="230" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fca5a5" text-anchor="middle">Confidence: 94.2%</text>

  <text x="655" y="290" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Out-of-context image</text>
  <text x="655" y="310" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">reuse detected.</text>
</svg>